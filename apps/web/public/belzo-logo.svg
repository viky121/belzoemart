<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Belzo eMart">
  <defs>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fae3f"/>
      <stop offset="1" stop-color="#2f9c46"/>
    </linearGradient>
    <linearGradient id="ringO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97a1f"/>
      <stop offset="1" stop-color="#f4601a"/>
    </linearGradient>
    <linearGradient id="wordB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3fa0"/>
      <stop offset="1" stop-color="#122b78"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ec53f"/>
      <stop offset="1" stop-color="#2f9c46"/>
    </linearGradient>
  </defs>

  <!-- decorative ring -->
  <path d="M28 260 A232 232 0 0 1 492 260" fill="none" stroke="url(#ringG)" stroke-width="13" stroke-linecap="round"/>
  <path d="M492 260 A232 232 0 0 1 28 260" fill="none" stroke="url(#ringO)" stroke-width="13" stroke-linecap="round"/>
  <path d="M300 486 A238 238 0 0 0 486 330" fill="none" stroke="#f4601a" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- shopping cart -->
  <g stroke="#f4601a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M212 168 h34 l22 96 h104"/>
    <path d="M268 190 h150 l-16 74 h-118"/>
    <line x1="300" y1="205" x2="300" y2="250"/>
    <line x1="340" y1="205" x2="338" y2="250"/>
    <line x1="380" y1="205" x2="376" y2="250"/>
    <line x1="272" y1="228" x2="410" y2="228"/>
    <line x1="178" y1="188" x2="150" y2="188"/>
    <line x1="184" y1="212" x2="158" y2="212"/>
    <line x1="190" y1="236" x2="168" y2="236"/>
  </g>
  <circle cx="300" cy="292" r="12" fill="#f4601a"/>
  <circle cx="384" cy="292" r="12" fill="#f4601a"/>

  <!-- bags in the cart -->
  <g stroke-linejoin="round">
    <path d="M318 118 h38 v66 h-38 z" fill="#39a935"/>
    <path d="M320 118 a19 16 0 0 1 34 0" fill="none" stroke="#1c1c1c" stroke-width="6"/>
    <path d="M360 96 h40 v88 h-40 z" fill="#f2a01f"/>
    <path d="M362 96 a20 18 0 0 1 36 0" fill="none" stroke="#6b3b12" stroke-width="6"/>
    <path d="M346 138 h34 v46 h-34 z" fill="#e23b2e"/>
    <path d="M347 138 a17 14 0 0 1 32 0" fill="none" stroke="#1c1c1c" stroke-width="5"/>
  </g>

  <!-- leaf accent -->
  <path d="M120 300 q-26 40 4 78 q22 -30 30 -78 q-18 6 -34 0 z" fill="url(#leaf)"/>
  <g stroke="#39a935" stroke-width="8" stroke-linecap="round">
    <line x1="112" y1="452" x2="150" y2="452"/>
    <line x1="120" y1="470" x2="150" y2="470"/>
  </g>

  <!-- wordmark -->
  <text x="266" y="392" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" font-style="italic" fill="url(#wordB)">Belzo</text>
  <text x="262" y="486" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="800" font-style="italic">
    <tspan fill="#39a935">e</tspan><tspan fill="#f4601a">Mart</tspan>
  </text>
  <text x="262" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2.5" fill="#5a6270">SHOP SMART • LIVE BETTER</text>
</svg>
