name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned tool versions; no `latest` (SECURITY-10).
env:
  NODE_VERSION: '20.14.0'
  PNPM_VERSION: '9.12.0'
  MOBILE_NODE_VERSION: '22.13.0'

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @belzo/api db:generate

      - name: Typecheck
        run: pnpm -r --filter '!@belzo/mobile' typecheck

      - name: Lint
        run: pnpm -r --filter '!@belzo/mobile' lint

      - name: Test (unit + property-based)
        run: pnpm -r --filter '!@belzo/mobile' test

      - name: Build
        run: pnpm build

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high
        continue-on-error: true

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.MOBILE_NODE_VERSION }}
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (mobile)
        run: pnpm --filter @belzo/mobile typecheck

      - name: Lint (mobile)
        run: pnpm --filter @belzo/mobile lint

      - name: Test (mobile)
        run: pnpm --filter @belzo/mobile test
